stages:
  - build
  - smoke

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/frontend-smoke.yml'

# Build via the shared template. It carries the branch rules (default branch +
# merge_request + renovate/*) and pushes :latest only on the default branch, so
# Renovate MRs get a green build+smoke pipeline and can auto-merge. Do NOT add
# an only:/rules: here that narrows it back to the default branch.
build:
  extends: .kaniko-build
  stage: build

# Smoke-test: load built image in real Chromium, fail on console errors / blank page
smoke-test:
  extends: .smoke-test
  needs: ["build"]
