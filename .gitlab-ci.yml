default:
  tags:
    - local

stages:
  - build
  - smoke

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/frontend-smoke.yml'

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  tags:
    - local
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"username\":\"${CI_REGISTRY_USER}\",\"password\":\"${CI_REGISTRY_PASSWORD}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}:latest"
      --registry-mirror=oci.coldforge.xyz
  only:
    - main
    - master

# Smoke-test: load built image in real Chromium, fail on console errors / blank page
smoke-test:
  extends: .smoke-test
  needs: ["build"]
